# CarnEvil GAME.EXE -> C.  Run: MidwayRecomp carnevil_recomp.toml
[input]
symbols_file_path = "carnevil_syms.toml"
rom_file_path = "extracted/GAME_padded.bin"
entrypoint = 0x800C4000
output_func_path = "recomp_out/funcs"
functions_per_output_file = 50
uses_mips3_float_mode = true
little_endian = true

[patches]
# Implemented in src/runtime instead of recompiled:
#  - 80151618 / 80151718 swap stacks to switch between game processes
#    (proc.c runs each process on its own host fiber).
#  - 800C408C..800C42C4 are the RTOS jump-table slots entry_point copies in at
#    boot; they are empty in GAME.EXE (rtos.c executes whatever was copied).
ignored = [
    "func_80151618",
    "func_80151718",
    "func_800C408C",
